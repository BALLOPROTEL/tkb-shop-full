version: "1"

projects:
  - name: TKB-Shop
    environments:
      - name: staging
        networking:
          isolation: disabled
        permissions:
          protection: enabled
        services:
          - type: web
            name: tkb-gateway-staging
            runtime: python
            plan: free
            region: frankfurt
            rootDir: services/gateway
            buildCommand: pip install -r requirements.txt
            startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
            healthCheckPath: /_health
            autoDeployTrigger: checksPass
            previews:
              generation: off
            envVars:
              - key: GATEWAY_SHARED_TOKEN
                generateValue: true
              - key: CORS_ORIGINS
                value: https://tkb-shop.vercel.app,https://tkb-shop-protels-projects.vercel.app,https://tkb-shop-git-main-protels-projects.vercel.app
              - key: CATALOG_SERVICE_URL
                fromService:
                  type: web
                  name: tkb-catalog-staging
                  envVarKey: RENDER_EXTERNAL_HOSTNAME
              - key: AUTH_SERVICE_URL
                fromService:
                  type: web
                  name: tkb-auth-staging
                  envVarKey: RENDER_EXTERNAL_HOSTNAME
              - key: ORDERS_SERVICE_URL
                fromService:
                  type: web
                  name: tkb-orders-staging
                  envVarKey: RENDER_EXTERNAL_HOSTNAME
              - key: PAYMENTS_SERVICE_URL
                fromService:
                  type: web
                  name: tkb-payments-staging
                  envVarKey: RENDER_EXTERNAL_HOSTNAME
              - key: BACKOFFICE_SERVICE_URL
                fromService:
                  type: web
                  name: tkb-backoffice-staging
                  envVarKey: RENDER_EXTERNAL_HOSTNAME
              - key: NOTIFICATIONS_SERVICE_URL
                fromService:
                  type: web
                  name: tkb-notifications-staging
                  envVarKey: RENDER_EXTERNAL_HOSTNAME
              - key: NOTIFICATIONS_WAKE_TIMEOUT_SECONDS
                value: "150"
              - key: NOTIFICATIONS_WAKE_INTERVAL_SECONDS
                value: "2"
              - key: UPSTREAM_WAKE_TIMEOUT_SECONDS
                value: "150"
              - key: UPSTREAM_WAKE_INTERVAL_SECONDS
                value: "2"

          - type: web
            name: tkb-auth-staging
            runtime: python
            plan: free
            region: frankfurt
            rootDir: services/auth
            buildCommand: pip install -r requirements.txt
            startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
            healthCheckPath: /_health
            autoDeployTrigger: checksPass
            previews:
              generation: off
            envVars:
              - key: GATEWAY_SHARED_TOKEN
                fromService:
                  type: web
                  name: tkb-gateway-staging
                  envVarKey: GATEWAY_SHARED_TOKEN
              - key: INTERNAL_SERVICE_TOKEN
                generateValue: true
              - key: JWT_SECRET
                generateValue: true
              - key: MONGO_URI
                sync: false
              - key: MONGO_DB_NAME
                value: tkb_auth
              - key: CLIENT_URL
                value: https://tkb-shop.vercel.app
              - key: NOTIFICATIONS_SERVICE_URL
                fromService:
                  type: web
                  name: tkb-notifications-staging
                  envVarKey: RENDER_EXTERNAL_HOSTNAME

          - type: web
            name: tkb-catalog-staging
            runtime: python
            plan: free
            region: frankfurt
            rootDir: services/catalog
            buildCommand: pip install -r requirements.txt
            startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
            healthCheckPath: /_health
            autoDeployTrigger: checksPass
            previews:
              generation: off
            envVars:
              - key: GATEWAY_SHARED_TOKEN
                fromService:
                  type: web
                  name: tkb-gateway-staging
                  envVarKey: GATEWAY_SHARED_TOKEN
              - key: INTERNAL_SERVICE_TOKEN
                fromService:
                  type: web
                  name: tkb-auth-staging
                  envVarKey: INTERNAL_SERVICE_TOKEN
              - key: MONGO_URI
                fromService:
                  type: web
                  name: tkb-auth-staging
                  envVarKey: MONGO_URI
              - key: MONGO_DB_NAME
                value: tkb_catalog
              - key: AUTH_SERVICE_URL
                fromService:
                  type: web
                  name: tkb-auth-staging
                  envVarKey: RENDER_EXTERNAL_HOSTNAME

          - type: web
            name: tkb-orders-staging
            runtime: python
            plan: free
            region: frankfurt
            rootDir: services/orders
