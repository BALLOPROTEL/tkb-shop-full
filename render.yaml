              - key: INTERNAL_SERVICE_TOKEN
                fromService:
                  type: web
                  name: tkb-auth-staging
                  envVarKey: INTERNAL_SERVICE_TOKEN
              - key: CLIENT_URL
                value: https://tkb-shop.vercel.app
              - key: AUTH_SERVICE_URL
                fromService:
                  type: web
                  name: tkb-auth-staging
                  envVarKey: RENDER_EXTERNAL_HOSTNAME
              - key: ORDERS_SERVICE_URL
                fromService:
                  type: web
                  name: tkb-orders-staging
                  envVarKey: RENDER_EXTERNAL_HOSTNAME
              - key: STRIPE_CURRENCY
                value: eur
              - key: STRIPE_AMOUNT_MULTIPLIER
                value: "100"
              - key: PAYPAL_ENV
                value: sandbox
              - key: PAYPAL_CURRENCY
                value: EUR
              - key: PAYPAL_FX_RATE
                value: "655"

          - type: web
            name: tkb-notifications-staging
            runtime: python
