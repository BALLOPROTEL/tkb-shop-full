              - key: MONGO_URI
                fromService:
                  type: web
                  name: tkb-auth-staging
                  envVarKey: MONGO_URI
              - key: MONGO_DB_NAME
                value: tkb_backoffice
              - key: AUTH_SERVICE_URL
                fromService:
                  type: web
                  name: tkb-auth-staging
                  envVarKey: RENDER_EXTERNAL_HOSTNAME
              - key: CATALOG_SERVICE_URL
                fromService:
                  type: web
                  name: tkb-catalog-staging
                  envVarKey: RENDER_EXTERNAL_HOSTNAME
              - key: ORDERS_SERVICE_URL
                fromService:
                  type: web
                  name: tkb-orders-staging
                  envVarKey: RENDER_EXTERNAL_HOSTNAME
