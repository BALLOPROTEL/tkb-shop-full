              - key: SMTP_HOST
                value: smtp-relay.brevo.com
              - key: SMTP_PORT
                value: "587"
              - key: SMTP_USER
                value: balloseydou1999@gmail.com
              - key: SMTP_PASS
                sync: false
              - key: SMTP_FROM
                value: "TKB Shop <balloseydou1999@gmail.com>"

          - type: web
            name: tkb-backoffice-staging
            runtime: python
            plan: free
            region: frankfurt
            rootDir: services/backoffice
            buildCommand: pip install -r requirements.txt
            startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
            healthCheckPath: /_health
            autoDeployTrigger: checksPass
            previews:
              generation: off
            envVars:
              - key: GATEWAY_SHARED_TOKEN
                fromService:
                  type: web
                  name: tkb-gateway-staging
