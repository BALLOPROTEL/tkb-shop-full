              - key: INTERNAL_SERVICE_TOKEN
                fromService:
                  type: web
                  name: tkb-auth-staging
                  envVarKey: INTERNAL_SERVICE_TOKEN
              - key: MONGO_URI
                fromService:
                  type: web
                  name: tkb-auth-staging
                  envVarKey: MONGO_URI
