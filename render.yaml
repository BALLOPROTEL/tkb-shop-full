                  envVarKey: RENDER_EXTERNAL_HOSTNAME
              - key: PAYMENTS_SERVICE_URL
                fromService:
                  type: web
                  name: tkb-payments-staging
                  envVarKey: RENDER_EXTERNAL_HOSTNAME

          - type: web
            name: tkb-payments-staging
            runtime: python
            plan: free
            region: frankfurt
            rootDir: services/payments
            buildCommand: pip install -r requirements.txt
            startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
            healthCheckPath: /_health
            autoDeployTrigger: checksPass
            previews:
              generation: off
            envVars:
              - key: GATEWAY_SHARED_TOKEN
                fromService:
                  type: web
                  name: tkb-gateway-staging
