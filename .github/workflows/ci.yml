name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  python-syntax:
    name: Python syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q backend/app services

  gateway-tests:
    name: Gateway tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/gateway/requirements.txt
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. pytest -q

  catalog-tests:
    name: Catalog tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/catalog
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/catalog/requirements.txt
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. pytest -q

  auth-tests:
    name: Auth tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/auth
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/auth/requirements.txt
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. pytest -q

  orders-tests:
    name: Orders tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/orders
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/orders/requirements.txt
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. pytest -q

  payments-tests:
    name: Payments tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/payments
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/payments/requirements.txt
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. pytest -q

  notifications-tests:
    name: Notifications tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/notifications
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/notifications/requirements.txt
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. pytest -q

  backoffice-tests:
    name: Backoffice tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/backoffice
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/backoffice/requirements.txt
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. pytest -q

  microservices-certification:
    name: Microservices certification
    runs-on: ubuntu-latest
    needs:
      - frontend
      - python-syntax
      - gateway-tests
      - catalog-tests
      - auth-tests
      - orders-tests
      - payments-tests
      - notifications-tests
      - backoffice-tests
    steps:
      - uses: actions/checkout@v4
      - name: Certify full microservices stack
        env:
          JWT_SECRET: ci-jwt-secret-change-me
          INTERNAL_SERVICE_TOKEN: ci-internal-secret-change-me
          CORS_ORIGINS: http://localhost:5173
          CLIENT_URL: http://localhost:5173
        run: python scripts/certify_microservices.py
