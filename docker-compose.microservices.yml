services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - tkb_mongo_data:/data/db

  legacy-api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017}
      MONGO_DB_NAME: ${MONGO_DB_NAME:-protel_shop}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5173}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_ENV: ${PAYPAL_ENV:-sandbox}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      - mongo
    ports:
      - "8005:8000"

  catalog:
    build:
      context: ./services/catalog
    restart: unless-stopped
    environment:
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017}
      MONGO_DB_NAME: ${MONGO_DB_NAME:-protel_shop}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    depends_on:
      - mongo
    ports:
      - "8001:8000"

  auth:
    build:
      context: ./services/auth
    restart: unless-stopped
    environment:
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017}
      MONGO_DB_NAME: ${MONGO_DB_NAME:-protel_shop}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5173}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
      NOTIFICATIONS_SERVICE_URL: http://notifications:8000
    depends_on:
      - mongo
    ports:
      - "8002:8000"

  gateway:
    build:
      context: ./services/gateway
    restart: unless-stopped
    environment:
      CATALOG_SERVICE_URL: http://catalog:8000
      AUTH_SERVICE_URL: http://auth:8000
      LEGACY_SERVICE_URL: http://legacy-api:8000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    depends_on:
      - catalog
      - auth
      - legacy-api
    ports:
      - "8000:8000"

volumes:
  tkb_mongo_data:
